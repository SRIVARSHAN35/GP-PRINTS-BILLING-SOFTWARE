{% load static %}
{% include "theme.html" %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Product - GP Prints</title>

    <link rel="stylesheet"
          href="{% static 'users/style.css' %}">

</head>

<body>

<div class="add-customer-page">

    <div class="add-customer-card">

        <h1>Add Product</h1>

        <p>Enter the product details below.</p>


        <form method="POST" class="customer-form">

            {% csrf_token %}


            <!-- MODEL NUMBER -->

            <div class="form-group">

                <label for="model_number">
                    Model Number
                </label>

                <input
                    type="text"
                    id="model_number"
                    name="model_number"
                    placeholder="Enter model number"
                    required>

            </div>


            <!-- PRODUCT NAME -->

            <div class="form-group">

                <label for="name">
                    Product Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter product name"
                    required>

            </div>


            <!-- CATEGORY -->

            <div class="form-group">

                <label for="category">
                    Category
                </label>

                <input
                    type="text"
                    id="category"
                    name="category"
                    placeholder="Enter category"
                    required>

            </div>


            <!-- PAPER TYPE -->

            <div class="form-group">

                <label for="paper_type">
                    Paper Type
                </label>

                <input
                    type="text"
                    id="paper_type"
                    name="paper_type"
                    placeholder="Enter paper type"
                    required>

            </div>


            <!-- PAPER SIZE -->

            <div class="form-group">

                <label for="paper_size">
                    Paper Size
                </label>

                <input
                    type="text"
                    id="paper_size"
                    name="paper_size"
                    placeholder="Enter paper size"
                    required>

            </div>


            <!-- PRINT TYPE -->

            <div class="form-group">

                <label for="print_type">
                    Print Type
                </label>

                <input
                    type="text"
                    id="print_type"
                    name="print_type"
                    placeholder="Enter print type"
                    required>

            </div>


            <!-- PRICE -->

            <div class="form-group">

                <label for="price">
                    Price
                </label>

                <input
                    type="number"
                    id="price"
                    name="price"
                    placeholder="Enter price"
                    step="0.01"
                    min="0"
                    required>

            </div>


            <!-- STOCK -->

            <div class="form-group">

                <label for="stock">
                    Stock
                </label>

                <input
                    type="number"
                    id="stock"
                    name="stock"
                    placeholder="Enter available quantity"
                    min="0"
                    required>

            </div>


            <!-- STATUS -->

            <div class="form-group">

                <label for="status">
                    Status
                </label>

                <select
                    id="status"
                    name="status"
                    required>

                    <option value="available">
                        Available
                    </option>

                    <option value="out_of_stock">
                        Out of Stock
                    </option>

                    <option value="discontinued">
                        Discontinued
                    </option>

                </select>

            </div>


            <!-- DESCRIPTION -->

            <div class="form-group">

                <label for="description">
                    Description
                </label>

                <textarea
                    id="description"
                    name="description"
                    placeholder="Enter product description"></textarea>

            </div>


            <!-- BUTTONS -->

            <div class="form-buttons">

                <button
                    type="submit"
                    class="save-customer-btn">

                    Save Product

                </button>


                <a
                    href="{% url 'product_list' %}"
                    class="cancel-btn">

                    Cancel

                </a>

            </div>


        </form>

    </div>

</div>

</body>

</html>
