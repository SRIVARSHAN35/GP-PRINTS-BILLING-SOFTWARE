{% load static %}
{% include "theme.html" %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>GP Prints - Login</title>

    <link rel="stylesheet"
          href="{% static 'users/style.css' %}">

</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <h1>GP Prints</h1>

            <p>Login to continue</p>


            {% if error %}

                <div class="login-error">
                    {{ error }}
                </div>

            {% endif %}


            <form method="POST"
                  action="{% url 'loginpage' %}">

                {% csrf_token %}


                <div class="form-group">

                    <label>
                        Username
                    </label>

                    <input
                        type="text"
                        name="username"
                        placeholder="Enter username"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Password
                    </label>

                    <input
                        type="password"
                        name="password"
                        placeholder="Enter password"
                        required
                    >

                </div>


                <button type="submit"
                        class="login-btn">

                    Login

                </button>

            </form>

        </div>

    </div>

</body>

</html>
