{% load static %}
{% include "theme.html" %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Customer - GP Prints</title>

    <link rel="stylesheet"
          href="{% static 'users/style.css' %}">

</head>

<body>

<div class="add-customer-page">

    <div class="add-customer-card">

        <h1>Edit Customer</h1>

        <p>
            Update the customer's information.
        </p>


        <form method="POST"
              class="customer-form">

            {% csrf_token %}


            <div class="form-group">

                <label for="name">
                    Customer Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    value="{{ customer.name }}"
                    required
                >

            </div>


            <div class="form-group">

                <label for="phone">
                    Phone Number
                </label>

                <input
                    type="text"
                    id="phone"
                    name="phone"
                    value="{{ customer.phone }}"
                    required
                >

            </div>


            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    value="{{ customer.email }}"
                >

            </div>


            <div class="form-group">

                <label for="address">
                    Address
                </label>

                <textarea
                    id="address"
                    name="address"
                >{{ customer.address }}</textarea>

            </div>


            <div class="form-buttons">

                <button
                    type="submit"
                    class="save-customer-btn">

                    Update Customer

                </button>


                <a
                    href="{% url 'customer_list' %}"
                    class="cancel-btn">

                    Cancel

                </a>

            </div>

        </form>

    </div>

</div>

</body>

</html>
